[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-clash"
version = "1.0.0"
description = "Auto Clash - Recovered Automation & Bot Platform"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "PySide6>=6.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "adbutils>=2.12.0",
    "uiautomator2>=3.7.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0"
]

[project.scripts]
auto-clash = "main:main"
